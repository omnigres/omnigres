$schema: "https://raw.githubusercontent.com/omnigres/omnigres/master/pg_yregress/schema.json"
instance:
  config:
    shared_preload_libraries: */env/OMNI_SO
    max_worker_processes: 64
    omni_worker.workers: 10
  init:
  - create extension dblink

tests:

- transaction: false
  query: create database test

- commit: true
  query: |
    select dblink_connect('anotherdb', 'hostaddr=127.0.0.1 dbname=test user=yregress port=' || current_setting('port'))

- query: select from dblink_exec('anotherdb', 'create extension omni_worker')
  commit: true

- query: select from dblink_exec('anotherdb', 'call omni_worker.stop()')
  commit: true

- commit: true
  query: select dblink_disconnect('anotherdb')

- transaction: false
  query: drop database test
